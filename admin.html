<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./libs/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./libs/bootstrap/css/bootstrap.min.css">
    <script src="./libs/bootstrap/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="./css/globals.css">
    <link rel="stylesheet" href="./css/layout.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
    <script src="./libs/anime.umd.min.js"></script>
    <!-- Filtro de Seguridad Admin -->
    <script type="module" src="./admin/admin-auth.js"></script>
    <title>Nexus Admin - Panel de Control</title>
</head>
<body>
    
    <main class="main-content">
        <header class="header px-3 px-md-4">
            <div class="d-flex justify-content-between align-items-center w-100">
                <div class="d-flex align-items-center gap-3">
                    <i class="bi bi-list d-md-none fs-3" id="mobile-toggle" style="cursor: pointer;"></i>
                    <h2 class="m-0 fs-6 fw-bold tracking-tight">NEXUS <span class="text-muted fw-normal">ADMIN</span></h2>
                </div>
                
                <div class="header-actions d-flex align-items-center gap-3">
                    <div class="theme-toggle p-2 rounded-circle hover-effect" id="theme-toggle" title="Cambiar Tema" style="cursor: pointer;">
                        <i class="bi bi-moon-fill fs-6" id="theme-icon"></i>
                    </div>
                    <!-- Botón Cerrar Sesión Premium -->
                    <div class="p-2 rounded-circle hover-effect text-danger" id="logout-btn" title="Cerrar Sesión" style="cursor: pointer;">
                        <i class="bi bi-box-arrow-right fs-6"></i>
                    </div>
                </div>
            </div>
        </header>

        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <aside class="sidebar">
            <div class="sidebar-content h-100 d-flex flex-column">
                <div class="logo-container mb-4">
                    <div class="logo">
                        <img src="./assets/img/logo.png" alt="Logo" width="22px" height="24px">
                        <span class="logo-text fw-bold fs-6 ms-2 d-md-none">Nexus Admin</span>
                    </div>
                    <div class="menu d-none d-md-block">
                        <span id="menu" style="cursor: pointer;"><i class="bi bi-layout-sidebar-inset"></i></span>
                        <span id="close" style="display: none; cursor: pointer;"><i class="bi bi-layout-sidebar"></i></span>
                    </div>
                    <i class="bi bi-x-lg d-md-none fs-5 text-muted" id="mobile-close" style="cursor: pointer;"></i>
                </div>
                
                <div class="menu-content">
                    <ul style="padding: 0px !important;">
                        <li class="item-content">
                            <div class="item-menu">    
                                <a data-module="home-admin" class="link-item">
                                    <div>
                                       <i class="bi bi-house-door"></i>  
                                    </div>   
                                    <div class="name-item">Inicio</div>
                                </a>
                            </div>
                        </li>
                        <li class="item-content">
                            <div class="item-menu">
                                <a data-module="estado-servicios" class="link-item">
                                    <div>
                                        <i class="bi bi-shield-check"></i>
                                    </div>   
                                    <div class="name-item">Servicios</div>
                                </a>
                            </div>
                        </li>
                        <li class="item-content">
                            <div class="item-menu">
                                <a data-module="reportes" class="link-item">
                                    <div>
                                        <i class="bi bi-bar-chart"></i> 
                                    </div>   
                                    <div class="name-item">Reportes</div>
                                </a>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </aside>

        <section class="content">
            <div class="view" id="view_mod"></div>
        </section>
        
        <footer class="footer"></footer>
    </main>
</body>
<script type="module" src="./admin/admin.js"></script>
</html>
