<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./libs/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./libs/bootstrap/css/bootstrap.min.css">
    <script src="./libs/bootstrap/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="./css/globals.css">
    <link rel="stylesheet" href="./css/layout.css">
    <title>Nexus - Admin Dashboard</title>
</head>
<body>
    
    <main class="main-content">
        <header class="header">
            <div class="d-flex justify-content-between align-items-center w-100">
                <div class="d-flex align-items-center">
                    <i class="bi bi-list d-md-none me-3 fs-3" id="mobile-toggle" style="cursor: pointer;"></i>
                    <h2>Nexus - Panel Administrativo</h2>
                </div>
                <div class="theme-toggle" id="theme-toggle" style="cursor: pointer;">
                    <i class="bi bi-moon-stars fs-5" id="theme-icon"></i>
                </div>
            </div>
        </header>

        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <aside class="sidebar">
            <div class="sidebar-content">
                <div class="logo-container">
                    <div class="logo">
                        <img src="./assets/img/logo.png" alt="Logo" width="28px" height="28px">
                    </div>
                    <div class="menu">
                        <span class="menu" id="menu"><i class="bi bi-layout-sidebar-inset fs-5"></i></span>
                        <span class="close" id="close" style="display: none;"><i class="bi bi-layout-sidebar fs-5"></i></span>
                    </div>
                </div>
                <div class="menu-content">
                    <ul style="padding: 0px !important;">
                        <li class="item-content">
                            <div class="item-menu">    
                                <a data-module="home-admin" class="link-item">
                                    <div>
                                       <i class="bi bi-house-door-fill"></i>  
                                    </div>   
                                    <div class="name-item">Home</div>
                                </a>
                            </div>
                        </li>
                        <li class="item-content">
                            <div class="item-menu">
                                <a data-module="estado-servicios" class="link-item">
                                    <div>
                                        <i class="bi bi-hdd-network-fill"></i>
                                    </div>   
                                    <div class="name-item">Estado Servicios</div>
                                </a>
                            </div>
                        </li>
                        <li class="item-content">
                            <div class="item-menu">
                                <a data-module="reportes" class="link-item">
                                    <div>
                                        <i class="bi bi-bar-chart-fill"></i> 
                                    </div>   
                                    <div class="name-item">Reportes</div>
                                </a>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </aside>

        <section class="content">
            <div class="view" id="view_mod"></div>
        </section>
        
        
        <footer class="footer">
            <!-- <p>&copy; 2025 Todos los derechos reservados.</p>-->
        </footer>
    </main>
</body>
<script type="module" src="./admin/admin.js"></script>
</html>
