<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="./assets/img/logo-admin.png">
    <link rel="stylesheet" href="../libs/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../libs/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/globals.css">
    <title>Nexus Admin - Login</title>
    <style>
        body {
            background-color: var(--bg-deep);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2.5rem !important;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            position: relative;
            z-index: 10;
        }
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0, 113, 227, 0.15) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }
        .logo-login {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="login-card">
        <div class="logo-login">
            <img src="../assets/img/logo.png" alt="Logo" width="30px" height="32px">
            <span class="logo-text fw-bold fs-5 ms-2 text-white">NEXUS <span class="text-primary">ADMIN</span></span>
        </div>
        <h4 class="fw-bold text-center mb-1 text-white">Panel de Control</h4>
        <p class="text-muted text-center small mb-4">Acceso restringido para administradores</p>
        
        <form id="login-form">
            <div class="mb-3">
                <label for="email" class="form-label text-secondary small">Correo electrónico</label>
                <input type="email" class="nx-input p-3 rounded-3" id="email" placeholder="admin@nexus.edu" required autocomplete="username">
            </div>
            <div class="mb-4">
                <label for="password" class="form-label text-secondary small">Contraseña</label>
                <input type="password" class="nx-input p-3 rounded-3" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="nx-btn nx-btn-primary w-100 py-3 rounded-3 justify-content-center fw-bold" id="login-btn">
                Iniciar Sesión <i class="bi bi-arrow-right ms-1"></i>
            </button>
        </form>
    </div>

    <!-- SweetAlert2 para notificaciones elegantes -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module">
        import Config from '../js/config.js';

        const loginForm = document.getElementById('login-form');
        const loginBtn = document.getElementById('login-btn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Validar que la API Key esté cargada en config.js
            if (!Config.FIREBASE.apiKey || Config.FIREBASE.apiKey.includes('TU_API_KEY')) {
                Swal.fire({
                    title: 'Error de Configuración',
                    text: 'Por favor, configura tu API Key de Firebase en js/config.js antes de iniciar sesión.',
                    icon: 'warning',
                    background: 'var(--bg-card)',
                    color: 'var(--text-primary)'
                });
                return;
            }

            // Cambiar estado del botón a cargando
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Autenticando...';

            const endpoint = `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${Config.FIREBASE.apiKey}`;

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        returnSecureToken: true
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || 'Credenciales incorrectas');
                }

                // Guardar sesión de forma segura
                localStorage.setItem('nexus_admin_token', data.idToken);
                localStorage.setItem('nexus_admin_user', JSON.stringify({
                    email: data.email,
                    localId: data.localId
                }));

                Swal.fire({
                    title: '¡Acceso Concedido!',
                    text: 'Redireccionando al panel de control...',
                    icon: 'success',
                    timer: 1500,
                    showConfirmButton: false,
                    background: 'var(--bg-card)',
                    color: 'var(--text-primary)'
                }).then(() => {
                    window.location.href = '../admin.html';
                });

            } catch (error) {
                console.error("Auth Error:", error);
                let message = 'No se pudo conectar con Firebase. Revisa tu red o configuración.';
                if (error.message === 'EMAIL_NOT_FOUND' || error.message === 'INVALID_PASSWORD') {
                    message = 'El correo electrónico o la contraseña son incorrectos.';
                } else if (error.message === 'USER_DISABLED') {
                    message = 'Esta cuenta ha sido inhabilitada.';
                }

                Swal.fire({
                    title: 'Acceso Denegado',
                    text: message,
                    icon: 'error',
                    background: 'var(--bg-card)',
                    color: 'var(--text-primary)'
                });
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Iniciar Sesión <i class="bi bi-arrow-right ms-1"></i>';
            }
        });
    </script>
</body>
</html>
