<div class="container-fluid p-4">
    <div class="row mb-4">
        <div class="col">
            <h2 class="fw-bold">Monitoreo Realtime de Servicios</h2>
            <p class="text-muted">Control centralizado de la disponibilidad de módulos.</p>
            <hr class="border-secondary">
        </div>
    </div>
    
    <div class="row g-4">
        <!-- Servicio: Dashboard -->
        <div class="col-md-6 col-lg-4">
            <div class="nx-card h-100 d-flex flex-column justify-content-between p-4">
                <div>
                    <h5 class="fw-bold d-flex justify-content-between align-items-center mb-3">
                        Dashboard
                        <span class="nx-badge nx-badge-success">Online</span>
                    </h5>
                    <p class="text-secondary small mb-0">Vista principal de métricas de usuario.</p>
                </div>
                <div class="form-check form-switch mt-4">
                    <input class="form-check-input" type="checkbox" checked id="switch-dashboard">
                    <label class="form-check-label text-secondary small ms-1" for="switch-dashboard">Estado del Servicio</label>
                </div>
            </div>
        </div>

        <!-- Servicio: Matrículas -->
        <div class="col-md-6 col-lg-4">
            <div class="nx-card h-100 d-flex flex-column justify-content-between p-4">
                <div>
                    <h5 class="fw-bold d-flex justify-content-between align-items-center mb-3">
                        Matrículas
                        <span class="nx-badge nx-badge-success">Online</span>
                    </h5>
                    <p class="text-secondary small mb-0">Gestión de datos académicos institucionales.</p>
                </div>
                <div class="form-check form-switch mt-4">
                    <input class="form-check-input" type="checkbox" checked id="switch-matriculas">
                    <label class="form-check-label text-secondary small ms-1" for="switch-matriculas">Estado del Servicio</label>
                </div>
            </div>
        </div>

        <!-- Servicio: Tickets IA -->
        <div class="col-md-6 col-lg-4">
            <div class="nx-card h-100 d-flex flex-column justify-content-between p-4">
                <div>
                    <h5 class="fw-bold d-flex justify-content-between align-items-center mb-3">
                        Tickets IA
                        <span class="nx-badge nx-badge-warning">Degraded</span>
                    </h5>
                    <p class="text-secondary small mb-0">Clasificación inteligente mediante APIs externas.</p>
                </div>
                <div class="form-check form-switch mt-4">
                    <input class="form-check-input" type="checkbox" checked disabled id="switch-tickets">
                    <label class="form-check-label text-muted small ms-1" for="switch-tickets">Monitoreo de Servicio (Externo)</label>
                </div>
            </div>
        </div>
    </div>
</div>
