<div class="container-fluid p-4">
    <div class="row mb-4">
        <div class="col">
            <h2 class="fw-bold">Monitoreo Realtime de Servicios</h2>
            <p class="text-muted">Control centralizado de la disponibilidad de módulos.</p>
            <hr class="border-secondary">
        </div>
    </div>
    
    <div class="row g-4">
        <!-- Servicio: Dashboard -->
        <div class="col-md-6 col-lg-4">
            <div class="card bg-dark text-white border-secondary h-100">
                <div class="card-body d-flex flex-column justify-content-between">
                    <div>
                        <h5 class="card-title d-flex justify-content-between">
                            Dashboard
                            <span class="badge bg-success">Online</span>
                        </h5>
                        <p class="card-text small text-muted">Vista principal de métricas de usuario.</p>
                    </div>
                    <div class="form-check form-switch mt-3">
                        <input class="form-check-input" type="checkbox" checked id="switch-dashboard">
                        <label class="form-check-label" for="switch-dashboard">Estado del Servicio</label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Servicio: Matrículas -->
        <div class="col-md-6 col-lg-4">
            <div class="card bg-dark text-white border-secondary h-100">
                <div class="card-body d-flex flex-column justify-content-between">
                    <div>
                        <h5 class="card-title d-flex justify-content-between">
                            Matrículas
                            <span class="badge bg-success">Online</span>
                        </h5>
                        <p class="card-text small text-muted">Gestión de datos académicos institucionales.</p>
                    </div>
                    <div class="form-check form-switch mt-3">
                        <input class="form-check-input" type="checkbox" checked id="switch-matriculas">
                        <label class="form-check-label" for="switch-matriculas">Estado del Servicio</label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Servicio: Tickets IA -->
        <div class="col-md-6 col-lg-4">
            <div class="card bg-dark text-white border-secondary h-100">
                <div class="card-body d-flex flex-column justify-content-between">
                    <div>
                        <h5 class="card-title d-flex justify-content-between">
                            Tickets IA
                            <span class="badge bg-warning text-dark">Degraded</span>
                        </h5>
                        <p class="card-text small text-muted">Clasificación inteligente mediante APIs externas.</p>
                    </div>
                    <div class="form-check form-switch mt-3">
                        <input class="form-check-input" type="checkbox" checked id="switch-tickets">
                        <label class="form-check-label" for="switch-tickets">Estado del Servicio</label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
