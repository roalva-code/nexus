<div class="container-fluid p-4 p-md-5">
    <div class="row mb-5 align-items-end">
        <div class="col">
            <h2 class="fw-bold mb-1">Reportes Analíticos</h2>
            <p class="text-secondary small">Monitoreo de actividad del sistema y rendimiento de microfrontends.</p>
        </div>
        <div class="col-auto">
            <div class="d-flex gap-2">
                <button class="nx-btn nx-btn-outline"><i class="bi bi-download me-2"></i> Exportar</button>
                <button class="nx-btn nx-btn-primary" onclick="location.reload()"><i class="bi bi-arrow-clockwise"></i></button>
            </div>
        </div>
    </div>

    <!-- Charts Row -->
    <div class="row g-4 mb-5">
        <div class="col-lg-8">
            <div class="nx-card p-4">
                <h5 class="fw-bold mb-4">Uso de Microservicios (Semanal)</h5>
                <div style="height: 350px;">
                    <canvas id="chart-servicios"></canvas>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="nx-card p-4 h-100">
                <h5 class="fw-bold mb-4">Distribución IA</h5>
                <div style="height: 250px;">
                    <canvas id="chart-ia"></canvas>
                </div>
                <div class="mt-4">
                    <div class="d-flex justify-content-between small mb-2">
                        <span class="text-muted">Model</span>
                        <span class="fw-bold">64%</span>
                    </div>
                    <div class="progress bg-secondary bg-opacity-20" style="height: 6px;">
                        <div class="progress-bar bg-primary" style="width: 64%"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Logs Section -->
    <div class="row">
        <div class="col-12">
            <h5 class="fw-bold mb-4">Logs de Actividad Reciente</h5>
            <div class="nx-table-container">
                <table class="nx-table">
                    <thead>
                        <tr>
                            <th>Evento</th>
                            <th>Módulo</th>
                            <th>Usuario</th>
                            <th>Timestamp</th>
                            <th class="text-end">Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-logs">
                        <!-- Se llenará con JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
