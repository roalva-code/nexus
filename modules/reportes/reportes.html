<div class="container-fluid p-4">
    <div class="row mb-4">
        <div class="col">
            <h2 class="fw-bold">Reportes y Métricas</h2>
            <p class="text-muted">Análisis detallado de la actividad del sistema NEXUS.</p>
            <hr class="border-secondary">
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card bg-dark text-white border-secondary h-100 p-4">
                <h5>Consumo de API por Módulo</h5>
                <div class="mt-4" style="height: 350px; background: #35424a; border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 1px dashed #4a5a64;">
                    <div class="text-center">
                        <i class="bi bi-graph-up-arrow fs-1 text-muted"></i>
                        <p class="text-muted mt-2">Visualización de Chart.js (Métricas de Tráfico)</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card bg-dark text-white border-secondary mb-4">
                <div class="card-body">
                    <h6 class="text-uppercase text-muted small fw-bold">Logs Recientes</h6>
                    <div class="mt-3">
                        <div class="d-flex align-items-center mb-3">
                            <div class="badge bg-primary rounded-circle p-2 me-3"><i class="bi bi-info-circle"></i></div>
                            <div>
                                <div class="small fw-bold">Login Exitoso: admin</div>
                                <div class="text-muted" style="font-size: 0.75rem;">Hace 5 minutos</div>
                            </div>
                        </div>
                        <div class="d-flex align-items-center mb-3">
                            <div class="badge bg-warning text-dark rounded-circle p-2 me-3"><i class="bi bi-exclamation-triangle"></i></div>
                            <div>
                                <div class="small fw-bold">API Gemini: Latencia alta</div>
                                <div class="text-muted" style="font-size: 0.75rem;">Hace 12 minutos</div>
                            </div>
                        </div>
                        <div class="d-flex align-items-center">
                            <div class="badge bg-success rounded-circle p-2 me-3"><i class="bi bi-check-lg"></i></div>
                            <div>
                                <div class="small fw-bold">Backup completado</div>
                                <div class="text-muted" style="font-size: 0.75rem;">Hace 1 hora</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <button class="btn btn-outline-light w-100 border-secondary">Descargar Reporte Completo (PDF)</button>
        </div>
    </div>
</div>
