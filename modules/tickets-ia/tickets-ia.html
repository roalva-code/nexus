<div class="container-fluid p-4 p-md-5">
    <div class="row mb-4">
        <div class="col-12">
            <h3 class="fw-bold mb-1">Asistente de Soporte Inteligente</h3>
            <p class="text-secondary small">Describe tu incidencia y nuestra IA te derivará al área técnica correspondiente.</p>
        </div>
    </div>

    <div class="row g-4 justify-content-center">
        <div class="col-xl-8 col-lg-10">
            <div class="nx-card chat-container">
                <!-- Chat Window -->
                <div class="chat-window" id="chat-window">
                    <div class="chat-message bot">
                        <div class="chat-bubble">
                            Hola, soy el asistente NEXUS. ¿En qué puedo ayudarte hoy? Por favor, describe el problema que estás teniendo.
                        </div>
                    </div>
                </div>

                <!-- Input Area -->
                <div class="chat-input-area border-top border-white border-opacity-10 mt-3 pt-3">
                    <form id="chat-form" class="d-flex gap-2">
                        <input type="text" class="nx-input" id="user-input" placeholder="Ej: No tengo internet en el laboratorio o mi cuenta SIAS está bloqueada..." autocomplete="off">
                        <button type="submit" class="nx-btn nx-btn-primary px-4">
                            <i class="bi bi-send-fill"></i>
                        </button>
                    </form>
                </div>
            </div>
            
            <!-- Result Card (Hidden by default) -->
            <div id="ai-result" class="mt-4 d-none animate-fadeIn">
                <!-- Se llenará dinámicamente -->
            </div>
        </div>
    </div>
</div>
