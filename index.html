<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="./assets/img/logo.png">
    <link rel="stylesheet" href="./libs/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./libs/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/globals.css">
    <link rel="stylesheet" href="./css/layout.css">
    <script src="./libs/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
    <script src="./libs/anime.umd.min.js"></script>
    <title>Nexus - Intranet</title>
</head>
<body>
    
    <main class="main-content">
        <header class="header">
            <div class="d-flex justify-content-between align-items-center w-100">
                <div class="d-flex align-items-center">
                    <i class="bi bi-list d-md-none me-3 fs-3" id="mobile-toggle" style="cursor: pointer;"></i>
                    <h2>Nexus - Intranet</h2>
                </div>
                <div class="theme-toggle" id="theme-toggle" style="cursor: pointer;">
                    <i class="bi bi-moon-fill fs-5" id="theme-icon"></i>
                </div>
            </div>
        </header>

        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <aside class="sidebar">
            <div class="sidebar-content">
                <div class="logo-container mb-4">
                    <div class="logo">
                        <img src="./assets/img/logo.png" alt="Logo" width="22px" height="24px">
                        <span class="logo-text fw-bold fs-6 ms-2 d-md-none">Nexus</span>
                    </div>
                    <div class="menu d-none d-md-block">
                        <span id="menu" style="cursor: pointer;"><i class="bi bi-layout-sidebar-inset"></i></span>
                        <span id="close" style="display: none; cursor: pointer;"><i class="bi bi-layout-sidebar"></i></span>
                    </div>
                    <i class="bi bi-x-lg d-md-none fs-5 text-muted" id="mobile-close" style="cursor: pointer;"></i>
                </div>
                <div class="menu-content">
                    <ul style="padding: 0px !important;">
                        <li class="item-content">
                            <div class="item-menu">    
                                <a data-module="home" class="link-item">
                                    <div>
                                       <i class="bi bi-house-door-fill"></i>  
                                    </div>   
                                    <div class="name-item">Home</div>
                                </a>
                            </div>
                        </li>
                        <li class="item-content">
                            <div class="item-menu">
                                <a data-module="dashboard" class="link-item">
                                    <div>
                                        <i class="bi bi-graph-up"></i>
                                    </div>   
                                    <div class="name-item">Dashboard</div>
                                </a>
                            </div>
                        </li>
                        <li class="item-content">
                            <div class="item-menu">
                                <a data-module="matriculas" class="link-item">
                                    <div>
                                        <i class="bi bi-journal-album"></i> 
                                    </div>   
                                    <div class="name-item">Matriculas</div>
                                </a>
                            </div>
                        </li>
                        <li class="item-content">
                            <div class="item-menu">    
                                <a data-module="tickets-ia" class="link-item">
                                    <div>
                                        <i class="bi bi-chat-dots"></i>
                                    </div>   
                                    <div class="name-item">Tickets IA</div>
                                </a>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </aside>

        <section class="content">
            <div class="view" id="view_mod"></div>
        </section>
        
        
        <footer class="footer">
            <!-- <p>&copy; 2025 Todos los derechos reservados.</p>-->
        </footer>
    </main>
</body>
<script type="module" src="./js/app.js"></script>
</html>
